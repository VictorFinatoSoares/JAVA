<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b2e"/>
      <stop offset="100%" style="stop-color:#0d0e1a"/>
    </linearGradient>
    <linearGradient id="cupFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4ff"/>
      <stop offset="100%" style="stop-color:#c8d0e8"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7b4a2a"/>
      <stop offset="100%" style="stop-color:#3d2010"/>
    </linearGradient>
    <linearGradient id="steam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a3c" stop-opacity="0"/>
      <stop offset="100%" style="stop-color:#ff9a3c" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="cupMask">
      <path d="M128 220 L152 390 Q156 410 180 410 L332 410 Q356 410 360 390 L384 220 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Steam wisps -->
  <path d="M190 195 Q170 155 190 115 Q210 75 190 55"
        fill="none" stroke="url(#steam)" stroke-width="14" stroke-linecap="round"/>
  <path d="M256 185 Q236 145 256 105 Q276 65 256 45"
        fill="none" stroke="url(#steam)" stroke-width="14" stroke-linecap="round"/>
  <path d="M322 195 Q342 155 322 115 Q302 75 322 55"
        fill="none" stroke="url(#steam)" stroke-width="14" stroke-linecap="round"/>

  <!-- Cup body -->
  <path d="M128 220 L152 390 Q156 410 180 410 L332 410 Q356 410 360 390 L384 220 Z"
        fill="url(#cupFill)"/>

  <!-- Coffee inside -->
  <rect x="128" y="255" width="256" height="200" fill="url(#coffee)" clip-path="url(#cupMask)"/>

  <!-- Coffee surface -->
  <ellipse cx="256" cy="257" rx="120" ry="16" fill="#9a6040"/>
  <ellipse cx="240" cy="254" rx="55" ry="8" fill="#c08060" opacity="0.5"/>

  <!-- Cup rim -->
  <rect x="116" y="205" width="280" height="28" rx="14" fill="url(#cupFill)"/>

  <!-- Handle -->
  <path d="M360 270 Q440 270 440 330 Q440 390 360 390"
        fill="none" stroke="url(#cupFill)" stroke-width="28" stroke-linecap="round"/>

  <!-- Saucer -->
  <ellipse cx="256" cy="422" rx="160" ry="18" fill="url(#cupFill)" opacity="0.8"/>
  <ellipse cx="256" cy="422" rx="100" ry="10" fill="#a0a8c0" opacity="0.3"/>

</svg>
